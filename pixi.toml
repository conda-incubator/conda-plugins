[workspace]
name = "conda-plugins"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.13"

[feature.render.dependencies]
pygithub = ">=2.4.0"

[feature.render.tasks]
render = { cmd = "python scripts/plugin_list.py", description = "Fetch plugins and generate index data" }

# The classifier is a separate feature so render runs do not install llama.cpp
# or pull the model unless something actually needs a category.
[feature.classify.dependencies]
llama-cpp-python = "0.3.34.*"

[feature.classify.tasks]
classify = { cmd = "python scripts/plugin_list.py --classify-only", description = "Fill in categories for unreviewed plugins" }

[feature.docs.dependencies]
sphinx = ">=7.0"
conda-sphinx-theme = ">=0.2"
myst-parser = ">=3.0"
sphinx-design = ">=0.6"
sphinx-copybutton = ">=0.5"
sphinx-sitemap = ">=2.5"

[feature.docs.tasks]
docs = { cmd = "sphinx-build -W --keep-going -b dirhtml docs docs/_build/dirhtml", description = "Build documentation" }
docs-serve = { cmd = "python -m http.server", cwd = "docs/_build/dirhtml" }

[feature.test.dependencies]
pytest = ">=8.0"
pytest-mock = ">=3.14"

[feature.test.tasks]
test = { cmd = "python -m pytest -v", description = "Run the test suite" }

[environments]
render = { features = ["render"], solve-group = "default" }
render-classify = { features = ["render", "classify"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
test = { features = ["render", "classify", "docs", "test"], solve-group = "default" }
